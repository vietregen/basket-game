<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shopping Basket Game</title>
<style>
:root{
  --bg:#070b17;--line:#1f3157;--blue:#4da3ff;--text:#e8eefc;--mut:#8ea0c4;
  --ok:#34d399;--bad:#f87171;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#10234d 0,#070b17 60%) fixed;color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font:inherit;color:inherit}
.hide{display:none!important}
.card{background:linear-gradient(180deg,#101a31,#0d1528);border:1px solid var(--line);border-radius:18px;padding:16px}
.mono{font-family:Consolas,"SF Mono","Courier New",monospace}
.title{font-family:Consolas,"SF Mono","Courier New",monospace;font-weight:800;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(90deg,#1d5cff,#5b3df5);box-shadow:0 8px 24px rgba(40,70,255,.35);transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;box-shadow:none}
.btn-ghost{padding:10px 16px;border-radius:12px;border:1px solid var(--line);color:var(--mut);font-weight:700}
.btn-ghost:hover{color:#fff;border-color:#37508a}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- landing / join ---------- */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;text-align:center}
.panel h1{font-size:26px}
.panel .emoji{font-size:64px;line-height:1}
.field{width:100%;padding:14px 16px;border-radius:14px;background:#0a1226;border:1px solid var(--line);font-size:18px;font-weight:700;text-align:center;outline:none}
.field:focus{border-color:var(--blue)}
.err{color:var(--bad);font-weight:700;min-height:1.2em}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid #1f3157;border-top-color:var(--blue);animation:sp 1s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.big-avatar{font-size:84px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* ---------- host ---------- */
.host{min-height:100vh;display:flex;flex-direction:column;padding:2.2vh 3vw;gap:2.2vh}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:20px}
.hhead .title{font-size:clamp(20px,2.6vw,40px)}
.lobby-grid{display:grid;grid-template-columns:minmax(280px,34vw) 1fr;gap:3vw;flex:1;min-height:0}
.left{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.qrbox{background:#fff;border-radius:22px;padding:18px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(77,163,255,.25),0 20px 50px rgba(0,0,0,.5)}
.qrbox svg{width:100%;height:100%;display:block}
.qrload{color:#334;font-weight:700}
.code{text-align:center;color:var(--mut);font-weight:700;font-size:clamp(14px,1.5vw,22px)}
.code b{display:block;color:#fff;font-family:Consolas,monospace;font-size:clamp(34px,4.6vw,76px);letter-spacing:.18em;margin-top:2px}
.urlline{text-align:center;color:var(--mut);font-size:13px;word-break:break-all}
details.urlcfg{background:#0a1226;border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--mut);font-size:13px}
details.urlcfg summary{cursor:pointer;font-weight:700}
details.urlcfg input{width:100%;margin-top:8px;padding:8px 10px;border-radius:8px;background:#060b18;border:1px solid var(--line);font-size:13px}
.warn{background:#3b2a0b;border:1px solid #7a5a12;color:#fcd34d;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.right{display:flex;flex-direction:column;gap:14px;min-height:0}
.rhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-size:clamp(14px,1.4vw,20px)}
.rhead b{color:#fff;font-size:clamp(24px,3vw,44px)}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;flex:1;overflow:auto;padding:4px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:#12204a;border:1px solid #27407f;font-weight:700;font-size:clamp(14px,1.4vw,22px);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.chip.off{opacity:.45}
.chip span:first-child{font-size:1.4em}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.empty{color:var(--mut);text-align:center;margin:auto;font-size:clamp(16px,1.6vw,24px)}
.btn-start{font-size:clamp(20px,2.2vw,34px);padding:18px 30px}

.play .phead{display:flex;align-items:center;gap:20px;justify-content:space-between}
.play .phead .title{font-size:clamp(18px,2.4vw,38px)}
.ptime{display:flex;align-items:center;gap:14px;font-weight:800;color:var(--mut);letter-spacing:.1em;font-size:clamp(12px,1.2vw,18px)}
.ptime b{font-family:Consolas,monospace;font-size:clamp(40px,6vw,96px);color:#fff;letter-spacing:.04em;line-height:1}
.ptime b.low{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.pstat{color:var(--mut);font-weight:700;font-size:clamp(13px,1.3vw,20px)}
.board{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,1),auto);grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:8px 22px;align-content:start;font-size:var(--fs,18px)}
.row{display:grid;grid-template-columns:2.4em 1.7em minmax(0,1fr) auto 3.2em;align-items:center;gap:.6em;padding:.45em .8em;border-radius:12px;background:#0f1a33;border:1px solid var(--line);border-left:5px solid #2a3b66}
.row.r1{border-left-color:var(--gold);background:#1c1a10}
.row.r2{border-left-color:var(--silver)}
.row.r3{border-left-color:var(--bronze)}
.row .rk{font-weight:800;color:var(--mut);text-align:center;font-family:Consolas,monospace}
.row.r1 .rk{color:var(--gold)}
.row .av{font-size:1.4em;text-align:center}
.row .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off .nm{opacity:.5}
.segs{display:flex;gap:.15em}
.segs i{width:.55em;height:.55em;border-radius:3px;background:#22304f;display:block}
.segs i.ok{background:var(--ok)}
.segs i.bad{background:var(--bad)}
.row .sc{font-weight:900;text-align:right;font-size:1.25em;font-family:Consolas,monospace}
.row.pop{animation:rowpop .9s ease-out}
@keyframes rowpop{0%{background:#14503a;transform:scale(1.02)}100%{transform:none}}

.res{align-items:center}
.res .title{font-size:clamp(24px,3.4vw,54px);text-align:center}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2.5vw;min-height:44vh;margin-top:1vh}
.pod{display:flex;flex-direction:column;align-items:center;width:clamp(120px,22vw,320px);animation:rise .8s cubic-bezier(.2,1.2,.4,1) both}
.pod.p1{animation-delay:.5s}.pod.p2{animation-delay:.25s}.pod.p3{animation-delay:0s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.pod .pav{font-size:clamp(44px,7vw,110px);line-height:1}
.pod .pnm{font-weight:900;font-size:clamp(18px,2.4vw,40px);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .psc{color:var(--mut);font-weight:700;font-size:clamp(14px,1.5vw,24px);margin-bottom:8px}
.pod .blk{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:clamp(34px,5vw,80px);font-weight:900;font-family:Consolas,monospace;color:#0b1020}
.p1 .blk{height:clamp(150px,26vh,300px);background:linear-gradient(#fde68a,var(--gold))}
.p2 .blk{height:clamp(110px,19vh,220px);background:linear-gradient(#f1f5f9,var(--silver))}
.p3 .blk{height:clamp(80px,14vh,160px);background:linear-gradient(#fdba74,var(--bronze))}
.rest{width:100%;max-width:1200px}
.res-actions{display:flex;gap:14px;justify-content:center}

/* ---------- player ---------- */
.shell{max-width:1040px;margin:0 auto;padding:12px 14px 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px}
.topbar .t{font-weight:800;color:var(--mut);letter-spacing:.05em;font-size:14px}
.topbar .t b{color:#fff;font-size:18px}
.timer{font-family:Consolas,monospace;font-weight:900;font-size:26px;letter-spacing:.05em}
.timer.low{color:var(--bad);animation:pulse 1s infinite}
.progress{height:6px;border-radius:6px;background:#17233f;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#1d5cff,#5b3df5);transition:width .3s}
.customer{display:flex;align-items:center;gap:14px;border-color:#1c3f86;background:linear-gradient(180deg,#0f1e40,#0b1630);margin-bottom:14px;flex-wrap:wrap}
.customer .avatar{font-size:54px;line-height:1}
.customer .cbody{flex:1;min-width:200px}
.cname{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--blue)}
.quote{font-size:clamp(18px,3.6vw,26px);font-weight:800;font-style:italic;line-height:1.3;margin-top:4px}
.btn-listen{padding:10px 16px;border-radius:12px;background:#1d5cff;font-weight:800;letter-spacing:.06em;font-size:13px}
.btn-listen:active{transform:scale(.96)}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.card-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#b4c3e6;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.clear{color:var(--bad);font-size:13px;font-weight:700;text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{position:relative;background:#101a31;border:1px solid var(--line);border-radius:14px;padding:26px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .08s,border-color .15s,background .15s;user-select:none;touch-action:manipulation}
.item:active{transform:scale(.95)}
.item.sel{border-color:var(--blue);background:#12244d}
.item .ico{width:46px;height:46px}
.ico *{stroke:rgba(255,255,255,.5);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.ico .ov{stroke:none}
.item .nm{font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.chipc{position:absolute;top:6px;right:6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;color:#fff}
.qtybadge{position:absolute;top:6px;left:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ok);color:#06281b;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.blist{display:flex;flex-direction:column;gap:8px;min-height:120px}
.bempty{color:#5c6c91;text-align:center;margin:auto;padding:30px 0;font-weight:600}
.brow{display:flex;align-items:center;gap:10px;background:#141f3a;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.brow .bi{flex:1;min-width:0}
.brow .bn{font-weight:800;font-size:14px}
.brow .bs{font-size:11px;color:var(--blue);font-weight:600}
.qty{display:flex;align-items:center;gap:8px;font-weight:800}
.qty button{width:28px;height:28px;border-radius:8px;background:#22304f;font-weight:900;font-size:16px;line-height:1}
.qty button:active{background:#33466f}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,11,23,0),#070b17 40%);z-index:20}
.bar-in{max-width:1040px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .count{min-width:90px;text-align:center;font-weight:800;color:var(--mut);font-size:13px;line-height:1.1}
.bar .count b{display:block;color:#fff;font-size:22px}
.bar .btn{flex:1;font-size:17px;padding:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,16,.78);backdrop-filter:blur(3px)}
.ovbox{max-width:420px;width:100%;text-align:center;border-radius:22px;padding:26px 20px;border:2px solid;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.ovbox.ok{background:#07281d;border-color:var(--ok)}
.ovbox.bad{background:#2a0e12;border-color:var(--bad)}
.ovbox .big{font-size:56px;line-height:1}
.ovbox h2{font-size:28px;margin:6px 0}
.ovbox p{color:#cbd5e1;font-weight:600;line-height:1.4}
.banner{position:fixed;top:0;left:0;right:0;z-index:60;background:#7a5a12;color:#fff;text-align:center;padding:8px;font-weight:700;font-size:14px}
.statbig{font-family:Consolas,monospace;font-size:64px;font-weight:900;line-height:1}
.muted{color:var(--mut);font-weight:600}
.rankbig{font-size:84px;font-weight:900;font-family:Consolas,monospace;line-height:1;background:linear-gradient(90deg,#4da3ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.toplist{display:flex;flex-direction:column;gap:8px;text-align:left}
.toplist .t{display:flex;align-items:center;gap:10px;background:#101a31;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800}
.toplist .t .s{margin-left:auto;font-family:Consolas,monospace}

@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .lobby-grid{grid-template-columns:1fr}
  .qrbox{max-width:360px;margin:0 auto;width:100%}
  .hhead{flex-direction:column;align-items:flex-start;gap:6px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="banner" class="banner hide"></div>
<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
'use strict';

/* =========================================================
   CONFIG  — change these numbers to tune the game
   ========================================================= */
const CFG = {
  TOTAL_Q: 10,        // questions per player
  SECONDS: 300,       // game length (5 minutes)
  POINTS: 10,         // points per correct order
  MAX_QTY_IN_BASKET: 9,
  MAX_NAME: 14,
  PREFIX: 'vtbasket-' // PeerJS room id prefix
};

/* =========================================================
   SHARED GAME DATA (same code runs on host + players, so the
   host can re-generate and verify every question from the seed)
   ========================================================= */
const COLORS = {
  Blue:'#3b82f6', Red:'#ef4444', Yellow:'#eab308', Pink:'#ec4899',
  Green:'#22c55e', Black:'#1f2937', White:'#f1f5f9'
};
const CHIP_TEXT = { Yellow:'#1b1400', White:'#0b1020' };
const SIZES = { S:'Small', M:'Medium', L:'Large' };
const NUMW = ['', 'one', 'two', 'three'];

const TYPES = {
  tshirt:{ name:'T-shirt', one:'T-shirt', many:'T-shirts',
    art:c=>`<path d="M21 9 L7 17 L12 28 L19 25 L19 55 L45 55 L45 25 L52 28 L57 17 L43 9 Q32 18 21 9Z" fill="${c}"/><path d="M21 9 Q32 18 43 9" fill="none"/>` },
  hoodie:{ name:'Hoodie', one:'hoodie', many:'hoodies',
    art:c=>`<path d="M22 14 L5 44 L14 48 L19 38 L19 58 L45 58 L45 38 L50 48 L59 44 L42 14 Q32 26 22 14Z" fill="${c}"/><path d="M22 14 Q22 4 32 4 Q42 4 42 14 Q32 26 22 14Z" fill="${c}"/><path class="ov" d="M25 44 h14 l3 10 h-20z" fill="rgba(0,0,0,.25)"/>` },
  cap:{ name:'Cap', one:'cap', many:'caps',
    art:c=>`<path d="M12 40 Q12 14 34 14 Q52 14 52 40Z" fill="${c}"/><path d="M10 40 H58 Q62 47 50 47 H10 Q6 47 10 40Z" fill="${c}"/><path class="ov" d="M10 40 H58 Q62 47 50 47 H10 Q6 47 10 40Z" fill="rgba(0,0,0,.22)"/><circle class="ov" cx="34" cy="14" r="2.5" fill="rgba(0,0,0,.3)"/>` },
  hat:{ name:'Hat', one:'hat', many:'hats',
    art:c=>`<ellipse cx="32" cy="42" rx="28" ry="9" fill="${c}"/><path d="M17 42 Q17 14 32 14 Q47 14 47 42 Q32 48 17 42Z" fill="${c}"/><path class="ov" d="M17.5 36 Q32 42 46.5 36 L47 42 Q32 48 17 42Z" fill="rgba(0,0,0,.3)"/>` },
  bottle:{ name:'Bottle', one:'bottle', many:'bottles',
    art:c=>`<rect x="26" y="6" width="12" height="9" rx="2" fill="#475569"/><path d="M27 15 h10 v6 q7 3 7 10 v22 a4 4 0 0 1 -4 4 h-16 a4 4 0 0 1 -4 -4 v-22 q0 -7 7 -10 z" fill="${c}"/><rect class="ov" x="22" y="34" width="20" height="12" rx="2" fill="rgba(255,255,255,.28)"/>` },
  backpack:{ name:'Backpack', one:'backpack', many:'backpacks',
    art:c=>`<path d="M25 16 Q25 6 32 6 Q39 6 39 16" fill="none" stroke-width="3"/><rect x="14" y="14" width="36" height="44" rx="14" fill="${c}"/><rect class="ov" x="20" y="36" width="24" height="16" rx="4" fill="rgba(0,0,0,.25)"/><path d="M20 28 H44" fill="none"/>` },
  shoes:{ name:'Shoes', one:'pair of', many:'pairs of',
    art:c=>`<path d="M5 46 V30 Q18 32 24 22 L32 28 Q42 34 58 38 Q61 46 56 48 H8 Q5 48 5 46Z" fill="${c}"/><path class="ov" d="M5 46 H58 Q60 52 54 53 H9 Q5 53 5 46Z" fill="rgba(255,255,255,.85)"/><path d="M27 26 l4 -3 M31 29 l4 -3" fill="none"/>` }
};
const TYPE_KEYS = Object.keys(TYPES);
const COLOR_KEYS = Object.keys(COLORS);
const SIZE_KEYS = Object.keys(SIZES);

const CUSTOMERS = [
  ['Emma','👩🏼'],['Liam','👦🏻'],['Sophia','👧🏽'],['Noah','🧑🏾'],['Olivia','👩🏻‍🦰'],['Jack','👨🏼'],
  ['Mia','👧🏻'],['Lucas','👦🏽'],['Ava','👩🏾'],['Ethan','🧔🏻'],['Grace','👵🏼'],['Leo','🧒🏽']
];
const INTROS = [['I want','.'],['I would like','.'],["I'd like",'.'],['Please give me','.'],['I need','.'],['Can I have','?']];
const AVATARS = ['🐶','🐱','🦊','🐼','🐯','🦁','🐸','🐵','🐰','🐻','🐨','🐧','🦄','🐙','🐢','🦉','🐳','🦋','🐞','🦖','🐷','🐮','🐔','🦆','🐺','🦒','🦓','🐘','🦔','🐿️'];

const KEY = o => o.type + '|' + o.color + '|' + o.size;

function rng(seed){
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function shuffle(r, arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function phraseLine(l){
  const col = l.color.toLowerCase(), t = TYPES[l.type];
  const noun = l.type === 'shoes'
    ? `${l.qty === 1 ? 'pair of' : 'pairs of'} ${col} shoes`
    : `${col} ${l.qty === 1 ? t.one : t.many}`;
  return `${NUMW[l.qty]} ${noun} in size ${SIZES[l.size]}`;
}
function orderText(lines, intro){
  const ph = lines.map(phraseLine);
  let body;
  if (ph.length === 1) body = ph[0];
  else if (ph.length === 2) body = `${ph[0]}, and ${ph[1]}`;
  else body = `${ph.slice(0, -1).join(', ')}, and ${ph[ph.length - 1]}`;
  return `${intro[0]} ${body}${intro[1]}`;
}

function genQuestions(seed){
  const r = rng(seed);
  const cust = shuffle(r, CUSTOMERS);
  const out = [];
  for (let i = 0; i < CFG.TOTAL_Q; i++){
    const nLines = i < 3 ? 1 : i < 7 ? 2 : 3;
    const types = shuffle(r, TYPE_KEYS).slice(0, nLines);
    const lines = types.map(type => ({
      type, color: pick(r, COLOR_KEYS), size: pick(r, SIZE_KEYS), qty: 1 + Math.floor(r() * 3)
    }));
    const opts = new Map();
    lines.forEach(l => opts.set(KEY(l), { type:l.type, color:l.color, size:l.size }));
    // traps: same item in another colour / another size
    for (const l of lines){
      const oc = pick(r, COLOR_KEYS.filter(c => c !== l.color));
      const os = pick(r, SIZE_KEYS.filter(s => s !== l.size));
      const a = { type:l.type, color:oc, size:l.size }, b = { type:l.type, color:l.color, size:os };
      opts.set(KEY(a), a); opts.set(KEY(b), b);
    }
    while (opts.size < 12){
      const o = { type:pick(r, TYPE_KEYS), color:pick(r, COLOR_KEYS), size:pick(r, SIZE_KEYS) };
      opts.set(KEY(o), o);
    }
    const intro = pick(r, INTROS);
    out.push({
      customer: { name: cust[i][0], emoji: cust[i][1] },
      lines,
      text: orderText(lines, intro),
      options: shuffle(r, [...opts.values()])
    });
  }
  return out;
}

// entries: [[key, qty], ...]  — exact match required (no extras, no missing)
function verifyBasket(q, entries){
  const want = new Map(q.lines.map(l => [KEY(l), l.qty]));
  const have = new Map();
  if (!Array.isArray(entries)) return false;
  for (const e of entries){
    if (!Array.isArray(e)) return false;
    const k = String(e[0]), n = Number(e[1]);
    if (!(n > 0)) continue;
    have.set(k, (have.get(k) || 0) + n);
  }
  if (have.size !== want.size) return false;
  for (const [k, n] of want) if (have.get(k) !== n) return false;
  return true;
}

let confettiRaf = 0;
function confetti(ms = 6000){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#fbbf24','#4da3ff','#34d399','#f87171','#a78bfa','#f472b6'];
  const ps = Array.from({ length: 140 }, () => ({
    x: Math.random() * cv.width, y: -Math.random() * cv.height,
    w: 6 + Math.random() * 8, h: 8 + Math.random() * 10, vy: 2 + Math.random() * 4,
    vx: -1.5 + Math.random() * 3, a: Math.random() * 6, va: -.2 + Math.random() * .4,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const end = Date.now() + ms;
  cancelAnimationFrame(confettiRaf);
  (function loop(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps){
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.y > cv.height && Date.now() < end - 1500){ p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    }
    if (Date.now() < end) confettiRaf = requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* =========================================================
   HOST
   ========================================================= */
function hostFlow(){
  keepAwake();
  const S = {
    phase: 'lobby', players: new Map(), code: '', peer: null,
    seed: 0, qs: null, startAt: 0, tick: null, ranked: [],
    base: location.href.split(/[?#]/)[0], joinSeq: 0
  };
  let prevScores = {};
  let boardTimer = 0, lobbyTimer = 0, countTimer = 0;

  const makeCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };

  function send(conn, msg){ try { if (conn && conn.open) conn.send(msg); } catch(e){} }
  function broadcast(msg){ for (const p of S.players.values()) if (p.connected) send(p.conn, msg); }
  const remaining = () => Math.max(0, CFG.SECONDS - (Date.now() - S.startAt) / 1000);

  /* ---- networking ---- */
  function openPeer(){
    S.code = makeCode();
    const peer = new Peer(CFG.PREFIX + S.code);
    S.peer = peer;
    peer.on('open', () => { const c = $('#code'); if (c) c.textContent = S.code; drawQR(); });
    peer.on('connection', onConn);
    peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} });
    peer.on('error', e => {
      if (e.type === 'unavailable-id'){ try { peer.destroy(); } catch(_){} openPeer(); return; }
      const q = $('#qr'); if (q && !q.querySelector('svg')) q.innerHTML = `<div class="qrload">Network error. Reload the page.</div>`;
    });
  }

  function onConn(conn){
    conn.on('data', m => handle(conn, m));
    conn.on('close', () => dropConn(conn));
    conn.on('error', () => dropConn(conn));
  }
  function dropConn(conn){
    const p = S.players.get(conn.__pid);
    if (p && p.conn === conn){ p.connected = false; schedule(); }
  }

  function uniqueName(name){
    const names = new Set([...S.players.values()].map(p => p.name.toLowerCase()));
    if (!names.has(name.toLowerCase())) return name;
    let i = 2; while (names.has((name + ' ' + i).toLowerCase())) i++;
    return name + ' ' + i;
  }

  function welcome(p){
    return {
      t: 'welcome', name: p.name, avatar: p.avatar, phase: S.phase, n: S.players.size,
      seed: S.seed, remaining: S.phase === 'playing' ? remaining() : 0,
      answered: p.answered, score: p.score
    };
  }

  function handle(conn, m){
    if (!m || typeof m !== 'object') return;
    if (m.t === 'join'){
      const pid = String(m.pid || '').slice(0, 40);
      if (!pid) return;
      let p = S.players.get(pid);
      if (p){
        p.conn = conn; p.connected = true; conn.__pid = pid;
        send(conn, welcome(p));
        if (S.phase === 'ended') send(conn, endMsgFor(p));
      } else {
        if (S.phase !== 'lobby'){ send(conn, { t: 'late' }); return; }
        let name = String(m.name || '').trim().replace(/\s+/g, ' ').slice(0, CFG.MAX_NAME) || 'Player';
        name = uniqueName(name);
        p = {
          pid, name, avatar: AVATARS[S.joinSeq++ % AVATARS.length], conn, connected: true,
          answered: 0, score: 0, res: [], lastAt: null, joinedAt: Date.now()
        };
        conn.__pid = pid;
        S.players.set(pid, p);
        send(conn, welcome(p));
        clearTimeout(countTimer);
        countTimer = setTimeout(() => broadcast({ t: 'count', n: S.players.size }), 300);
      }
      schedule();
      return;
    }
    const p = S.players.get(conn.__pid);
    if (!p) return;
    if (m.t === 'ans' && S.phase === 'playing'){
      if (m.q !== p.answered || p.answered >= CFG.TOTAL_Q) return;
      const ok = verifyBasket(S.qs[m.q], m.basket);
      p.res[m.q] = ok; p.answered++;
      if (ok) p.score += CFG.POINTS;
      p.lastAt = (Date.now() - S.startAt) / 1000;
      send(conn, { t: 'res', q: m.q, ok, score: p.score });
      schedule();
      if ([...S.players.values()].every(x => x.answered >= CFG.TOTAL_Q)) endGame();
    }
  }

  /* ---- ranking ---- */
  function ranking(){
    return [...S.players.values()].sort((a, b) =>
      b.score - a.score ||
      (a.lastAt ?? Infinity) - (b.lastAt ?? Infinity) ||
      a.joinedAt - b.joinedAt);
  }
  function endMsgFor(p){
    const r = S.ranked, i = r.indexOf(p);
    return {
      t: 'end', rank: i + 1, n: r.length, score: p.score, time: p.lastAt,
      top: r.slice(0, 3).map(x => ({ name: x.name, avatar: x.avatar, score: x.score, time: x.lastAt }))
    };
  }

  /* ---- game control ---- */
  function startGame(){
    if (S.phase !== 'lobby' || !S.players.size) return;
    S.seed = (Math.random() * 2147483647) | 0 || 1;
    S.qs = genQuestions(S.seed);
    S.phase = 'playing';
    S.startAt = Date.now();
    prevScores = {};
    for (const p of S.players.values()){ p.answered = 0; p.score = 0; p.res = []; p.lastAt = null; }
    broadcast({ t: 'start', seed: S.seed, seconds: CFG.SECONDS, total: CFG.TOTAL_Q });
    showPlay();
    S.tick = setInterval(tick, 250);
  }
  function tick(){
    const r = remaining();
    const el = $('#ht');
    if (el){ el.textContent = fmt(r); el.classList.toggle('low', r <= 10); }
    if (r <= 0) endGame();
  }
  function endGame(){
    if (S.phase !== 'playing') return;
    clearInterval(S.tick);
    S.phase = 'ended';
    S.ranked = ranking();
    for (const p of S.players.values()) if (p.connected) send(p.conn, endMsgFor(p));
    showResult();
  }
  // Full reset: kick everyone, close the old room and open a brand-new one (new code + QR)
  function resetAll(){
    clearInterval(S.tick);
    broadcast({ t: 'kick' });
    const old = S.peer;
    setTimeout(() => { try { old && old.destroy(); } catch(e){} }, 400);
    S.phase = 'lobby'; S.players = new Map(); S.joinSeq = 0; S.qs = null; S.ranked = [];
    S.seed = 0; S.code = ''; S.peer = null; prevScores = {};
    showLobby();
    openPeer();
  }

  /* ---- UI: lobby ---- */
  function showLobby(){
    mount(`
    <div class="host">
      <div class="hhead"><div class="title">🛒 Shopping Basket Game</div></div>
      <div class="lobby-grid">
        <div class="left">
          <div class="qrbox" id="qr"><div class="qrload">Connecting…</div></div>
          <div class="code">ROOM CODE<b id="code">${S.code || '·····'}</b></div>
          <div class="urlline" id="urltxt"></div>
          <details class="urlcfg" ${location.protocol === 'file:' ? 'open' : ''}>
            <summary>Game link</summary>
            <input id="base" value="${esc(S.base)}" spellcheck="false">
          </details>
          <div class="warn ${location.protocol === 'file:' ? '' : 'hide'}" id="warn">This file is opened locally. Upload it to a web host and paste the public link above, or phones will not be able to join.</div>
        </div>
        <div class="right card">
          <div class="rhead"><span>Players</span><b id="pc">0</b></div>
          <div class="chips" id="chips"></div>
          <div class="empty" id="empty">Waiting for players…</div>
          <button class="btn btn-start" id="start" disabled>▶ Start</button>
        </div>
      </div>
    </div>`);
    $('#start').onclick = startGame;
    $('#base').oninput = e => { S.base = e.target.value.trim(); drawQR(); };
    updateLobby();
  }
  function joinUrl(){ return S.base + (S.base.includes('?') ? '&' : '?') + 'room=' + S.code; }
  function drawQR(){
    const box = $('#qr'); if (!box || !S.code) return;
    const url = joinUrl();
    const t = $('#urltxt'); if (t) t.textContent = url;
    if (typeof qrcode === 'undefined'){ box.innerHTML = `<div class="qrload">${esc(url)}</div>`; return; }
    try {
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      const n = qr.getModuleCount(); let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      box.innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
    } catch(e){ box.innerHTML = `<div class="qrload">${esc(url)}</div>`; }
  }
  function updateLobby(){
    if (S.phase !== 'lobby') return;
    const chips = $('#chips'); if (!chips) return;
    const list = [...S.players.values()];
    $('#pc').textContent = list.length;
    $('#empty').classList.toggle('hide', list.length > 0);
    $('#start').disabled = list.length === 0;
    const have = new Set([...chips.children].map(c => c.dataset.pid));
    // add new / update state
    for (const p of list){
      let el = chips.querySelector(`[data-pid="${CSS.escape(p.pid)}"]`);
      if (!el){
        el = document.createElement('div'); el.className = 'chip'; el.dataset.pid = p.pid;
        el.innerHTML = `<span>${p.avatar}</span><span>${esc(p.name)}</span>`;
        chips.appendChild(el);
      }
      el.classList.toggle('off', !p.connected);
      have.delete(p.pid);
    }
    for (const pid of have){ const el = chips.querySelector(`[data-pid="${CSS.escape(pid)}"]`); if (el) el.remove(); }
  }

  /* ---- UI: live board ---- */
  function showPlay(){
    mount(`
    <div class="host play">
      <div class="phead">
        <div class="title">🛒 Live leaderboard</div>
        <div class="ptime"><span>TIME LEFT</span><b id="ht">${fmt(CFG.SECONDS)}</b></div>
        <button class="btn-ghost" id="endnow">End now</button>
      </div>
      <div class="pstat" id="pstat"></div>
      <div class="board" id="board"></div>
    </div>`);
    $('#endnow').onclick = () => { if (confirm('End the game now?')) endGame(); };
    updateBoard();
  }
  function updateBoard(){
    if (S.phase !== 'playing') return;
    const board = $('#board'); if (!board) return;
    const r = ranking(), n = r.length;
    const vh = innerHeight, vw = innerWidth;
    // pick the column count that gives the biggest readable font while fitting the screen
    let cols = 1, fs = 0;
    for (let c = 1; c <= 4; c++){
      const rw = Math.ceil(n / c);
      const f = Math.min(26, (vh * 0.72 / rw - 8) / 2.4, (vw * 0.94 - 22 * (c - 1)) / (c * 24));
      if (f > fs + 0.5){ fs = f; cols = c; }
    }
    fs = Math.max(10, fs);
    const rows = Math.ceil(n / cols);
    board.style.setProperty('--cols', cols);
    board.style.setProperty('--rows', rows);
    board.style.setProperty('--fs', fs.toFixed(1) + 'px');
    board.innerHTML = r.map((p, i) => {
      const segs = Array.from({ length: CFG.TOTAL_Q }, (_, k) => `<i class="${p.res[k] === true ? 'ok' : p.res[k] === false ? 'bad' : ''}"></i>`).join('');
      const pop = prevScores[p.pid] !== undefined && p.score > prevScores[p.pid] ? ' pop' : '';
      return `<div class="row r${i < 3 ? i + 1 : ''}${p.connected ? '' : ' off'}${pop}">
        <div class="rk">${i + 1}</div><div class="av">${p.avatar}</div><div class="nm">${esc(p.name)}</div>
        <div class="segs">${segs}</div><div class="sc">${p.score}</div></div>`;
    }).join('');
    prevScores = Object.fromEntries(r.map(p => [p.pid, p.score]));
    const done = r.filter(p => p.answered >= CFG.TOTAL_Q).length;
    $('#pstat').textContent = `${n} players · ${done} finished`;
  }

  /* ---- UI: results ---- */
  function showResult(){
    const r = S.ranked, top = r.slice(0, 3);
    const t = p => p.lastAt == null ? '' : ` · ${p.lastAt.toFixed(1)}s`;
    const pod = (p, k) => p ? `
      <div class="pod p${k}">
        <div class="pav">${p.avatar}</div>
        <div class="pnm">${esc(p.name)}</div>
        <div class="psc">${p.score} pts${t(p)}</div>
        <div class="blk">${k}</div>
      </div>` : '';
    const rest = r.slice(3);
    mount(`
    <div class="host res">
      <div class="title">🏆 Top 3</div>
      <div class="podium">${pod(top[1], 2)}${pod(top[0], 1)}${pod(top[2], 3)}</div>
      ${rest.length ? `<div class="rest"><div class="board" id="rest"></div></div>` : ''}
      <div class="res-actions"><button class="btn" id="again">↺ Reset · New game</button></div>
    </div>`);
    if (rest.length){
      const b = $('#rest'), cols = rest.length > 8 ? 2 : 1;
      b.style.setProperty('--cols', cols); b.style.setProperty('--rows', Math.ceil(rest.length / cols)); b.style.setProperty('--fs', '16px');
      b.innerHTML = rest.map((p, i) => `<div class="row"><div class="rk">${i + 4}</div><div class="av">${p.avatar}</div><div class="nm">${esc(p.name)}</div><div></div><div class="sc">${p.score}</div></div>`).join('');
    }
    $('#again').onclick = resetAll;
    confetti();
  }

  function schedule(){
    if (S.phase === 'playing'){ if (!boardTimer) boardTimer = setTimeout(() => { boardTimer = 0; updateBoard(); }, 150); }
    else if (S.phase === 'lobby'){ if (!lobbyTimer) lobbyTimer = setTimeout(() => { lobbyTimer = 0; updateLobby(); }, 100); }
  }

  showLobby();
  openPeer();
  addEventListener('resize', () => { if (S.phase === 'playing') updateBoard(); });
}

    mount(`
    <div class="center"><div class="panel card">
      <div class="muted">Your rank</div>
      <div class="rankbig">#${m.rank}</div>
      <div class="muted">of ${m.n} players</div>
      <div><b style="font-size:28px">${m.score}</b> <span class="muted">points${m.time != null ? ' · ' + m.time.toFixed(1) + 's' : ''}</span></div>
      <div class="toplist">${(m.top || []).map((p, i) => `<div class="t"><span>${medals[i]}</span><span>${p.avatar}</span><span>${esc(p.name)}</span><span class="s">${p.score}</span></div>`).join('')}</div>
    </div></div>`);
    if (m.rank <= 3) confetti(5000);
  }

  /* ---- play screen ---- */
  function playScreen(){
    P.screen = 'play';
    mount(`
    <div class="shell">
      <div class="topbar">
        <div class="t">Order <b id="qn">1</b>/${CFG.TOTAL_Q}</div>
        <div class="timer" id="timer">${fmt(CFG.SECONDS)}</div>
        <div class="t"><b id="sc">0</b> pts</div>
      </div>
      <div class="progress"><i id="pbar" style="width:0"></i></div>
      <div class="customer card">
        <div class="avatar" id="av"></div>
        <div class="cbody"><div class="cname" id="cname"></div><div class="quote" id="quote"></div></div>
        <button class="btn-listen" id="listen">🔊 LISTEN</button>
      </div>
      <div class="cols">
        <div class="card"><div class="card-title"><span>Available clothes &amp; items</span></div><div class="grid" id="grid"></div></div>
        <div class="card"><div class="card-title"><span>Basket</span><button class="clear" id="clear">Clear</button></div><div class="blist" id="blist"></div></div>
      </div>
    </div>
    <div class="bar"><div class="bar-in">
      <div class="count"><b id="bcount">0</b>in basket</div>
      <button class="btn" id="check">Check basket</button>
    </div></div>`);
    $('#listen').onclick = () => { const q = P.qs[P.qi]; if (q) speak(q.text); };
    $('#clear').onclick = () => { if (P.locked) return; P.basket.clear(); renderBasket(); };
    $('#check').onclick = check;
    $('#grid').onclick = e => {
      const it = e.target.closest('.item'); if (!it || P.locked) return;
      const k = it.dataset.k, n = P.basket.get(k) || 0;
      if (n >= CFG.MAX_QTY_IN_BASKET) return;
      P.basket.set(k, n + 1); renderBasket();
      try { navigator.vibrate && navigator.vibrate(8); } catch(_){}
    };
    $('#blist').onclick = e => {
      const b = e.target.closest('button[data-act]'); if (!b || P.locked) return;
      const k = b.dataset.k, n = P.basket.get(k) || 0;
      if (b.dataset.act === 'inc'){ if (n < CFG.MAX_QTY_IN_BASKET) P.basket.set(k, n + 1); }
      else { if (n <= 1) P.basket.delete(k); else P.basket.set(k, n - 1); }
      renderBasket();
    };
  }
  function renderQuestion(){
    const q = P.qs[P.qi]; if (!q) return;
    $('#qn').textContent = P.qi + 1;
    $('#pbar').style.width = (P.qi / CFG.TOTAL_Q * 100) + '%';
    $('#sc').textContent = P.score;
    $('#av').textContent = q.customer.emoji;
    $('#cname').textContent = 'CUSTOMER: ' + q.customer.name.toUpperCase();
    $('#quote').textContent = '“' + q.text + '”';
    $('#grid').innerHTML = q.options.map(o => {
      const bg = COLORS[o.color], fg = CHIP_TEXT[o.color] || '#fff';
      const border = o.color === 'Black' ? 'border:1px solid #475569;' : '';
      return `<button class="item" data-k="${KEY(o)}">
        <span class="chipc" style="background:${bg};color:${fg};${border}">${o.color}</span>
        <span class="qtybadge hide"></span>
        ${iconSvg(o.type, o.color)}
        <span class="nm">${itemName(o)}</span></button>`;
    }).join('');
    renderBasket();
  }
  function renderBasket(){
    const q = P.qs[P.qi]; if (!q) return;
    const byKey = new Map(q.options.map(o => [KEY(o), o]));
    let total = 0, html = '';
    for (const [k, n] of P.basket){
      const o = byKey.get(k); if (!o) continue;
      total += n;
      html += `<div class="brow"><div class="bi"><div class="bn">${TYPES[o.type].name}</div><div class="bs">${o.color} • Size ${o.size}</div></div>
        <div class="qty"><button data-act="dec" data-k="${k}">-</button><span>${n}</span><button data-act="inc" data-k="${k}">+</button></div></div>`;
    }
    $('#blist').innerHTML = html || `<div class="bempty">Basket is empty</div>`;
    $('#bcount').textContent = total;
    $('#grid').querySelectorAll('.item').forEach(el => {
      const n = P.basket.get(el.dataset.k) || 0, b = el.querySelector('.qtybadge');
      el.classList.toggle('sel', n > 0); b.classList.toggle('hide', n === 0); b.textContent = n;
    });
  }

  function check(){
    if (P.locked || P.screen !== 'play') return;
    if (!P.basket.size){ const b = $('#check'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    if (!P.conn || !P.conn.open){ banner('Reconnecting… try again in a moment'); return; }
    P.locked = true;
    const q = P.qs[P.qi], entries = [...P.basket];
    const ok = verifyBasket(q, entries);
    try { P.conn.send({ t: 'ans', q: P.qi, basket: entries }); } catch(e){}
    if (ok){ P.score += CFG.POINTS; $('#sc').textContent = P.score; }
    showOverlay(ok, q);
    setTimeout(next, ok ? 1000 : 2300);
  }
  function showOverlay(ok, q){
    hideOverlay();
    const o = document.createElement('div'); o.className = 'overlay'; o.id = 'ov';
    o.innerHTML = ok
      ? `<div class="ovbox ok"><div class="big">✅</div><h2>Correct!</h2><p>+${CFG.POINTS} points</p></div>`
      : `<div class="ovbox bad"><div class="big">❌</div><h2>Not quite</h2><p>${esc(q.text)}</p></div>`;
    document.body.appendChild(o);
  }
  function hideOverlay(){ const o = $('#ov'); if (o) o.remove(); }
  function next(){
    hideOverlay();
    if (P.screen !== 'play') return;
    P.qi++; P.basket.clear();
    if (P.qi >= CFG.TOTAL_Q){ doneScreen(false); return; }
    P.locked = false; renderQuestion();
  }

  /* ---- timer ---- */
  function stopTimer(){ clearInterval(P.timer); P.timer = 0; }
  function startTimer(){
    stopTimer();
    const tick = () => {
      const rem = (P.endAt - Date.now()) / 1000, el = $('#timer');
      if (el){ el.textContent = fmt(rem); el.classList.toggle('low', rem <= 10); }
      if (rem <= 0 && P.screen === 'play'){ P.timeUp = true; hideOverlay(); doneScreen(true); }
    };
    tick(); P.timer = setInterval(tick, 250);
  }
  function beginPlay(seed, seconds, answered, score){
    P.seed = seed; P.qs = genQuestions(seed); P.qi = answered; P.score = score;
    P.basket = new Map(); P.locked = false; P.timeUp = false; P.endAt = Date.now() + seconds * 1000;
    hideOverlay();
    if (answered >= CFG.TOTAL_Q){ doneScreen(false); return; }
    if (seconds <= 0){ doneScreen(true); return; }
    playScreen(); renderQuestion(); startTimer();
  }

  /* ---- networking ---- */
  function fail(msg){
    P.joined = false;
    try { P.peer && P.peer.destroy(); } catch(e){}
    joinScreen(msg);
  }
  function connect(){
    try { P.peer && P.peer.destroy(); } catch(e){}
    let opened = false, dead = false;
    const peer = new Peer(); P.peer = peer;
    const giveUp = () => {
      if (dead || opened) return; dead = true;
      if (P.joined) scheduleRetry(); else fail('Cannot reach the room. Check the code.');
    };
    const to = setTimeout(giveUp, 15000);
    peer.on('open', () => {
      const conn = peer.connect(CFG.PREFIX + P.code, { reliable: true });
      P.conn = conn;
      conn.on('open', () => { opened = true; clearTimeout(to); banner(''); conn.send({ t: 'join', pid: P.pid, name: P.name }); });
      conn.on('data', onMsg);
      conn.on('close', () => { if (P.conn === conn && opened) onLost(); });
      conn.on('error', () => {});
    });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable'){ clearTimeout(to); if (P.joined){ dead = true; scheduleRetry(); } else fail('Room not found. Check the code.'); }
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} });
  }
  function onLost(){
    if (P.screen === 'result' || P.kicked) return;
    banner('Connection lost — reconnecting…');
    scheduleRetry();
  }
  function scheduleRetry(){
    clearTimeout(P.retry);
    if (P.kicked) return;
    P.retry = setTimeout(() => { banner('Connection lost — reconnecting…'); connect(); }, 2500);
  }

  function onMsg(m){
    if (!m || typeof m !== 'object') return;
    switch (m.t){
      case 'welcome':
        P.joined = true; P.name = m.name; P.avatar = m.avatar; P.n = m.n; banner('');
        try { localStorage.setItem('vtb_name', m.name); } catch(e){}
        if (m.phase === 'lobby'){ if (P.screen !== 'wait') waitScreen(); }
        else if (m.phase === 'playing'){
          if (P.screen === 'play' && P.seed === m.seed){
            if (m.answered !== P.qi){ P.qi = m.answered; P.score = m.score; P.basket.clear(); P.locked = false; hideOverlay(); renderQuestion(); }
          } else if (P.screen !== 'done' || P.seed !== m.seed){
            beginPlay(m.seed, m.remaining, m.answered, m.score);
          }
        }
        break;
      case 'count': P.n = m.n; { const c = $('#cnt'); if (c) c.textContent = `${m.n} player${m.n === 1 ? '' : 's'} in the room`; } break;
      case 'start': beginPlay(m.seed, m.seconds, 0, 0); break;
      case 'res': P.score = m.score; { const s = $('#sc'); if (s) s.textContent = m.score; const d = $('#dsc'); if (d) d.textContent = m.score; } break;
      case 'lobby': P.n = m.n; P.seed = null; waitScreen(); break;
      case 'end': resultScreen(m); break;
      case 'late': lateScreen(); break;
      case 'kick': kickScreen(); break;
    }
  }

  joinScreen();
}
</script>
</body>
</html>
